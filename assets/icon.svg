<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- book cover -->
  <rect x="86" y="110" width="340" height="292" rx="18" fill="url(#book)"/>

  <!-- book spine -->
  <rect x="86" y="110" width="56" height="292" rx="18" fill="#cbd5e1"/>
  <rect x="86" y="110" width="56" height="292" fill="#cbd5e1"/>

  <!-- title + subtitle lines representing a title/author -->
  <rect x="168" y="160" width="210" height="34" rx="12" fill="#2b6cb0"/>
  <rect x="168" y="214" width="150" height="18" rx="9" fill="#cbd5e1"/>

  <!-- audio play triangle -->
  <path d="M218 300 L218 356 L266 328 Z" fill="#e53e3e"/>

  <!-- waveform bars -->
  <rect x="290" y="308" width="18" height="52" rx="9" fill="#2b6cb0"/>
  <rect x="322" y="288" width="18" height="88" rx="9" fill="#2b6cb0"/>
  <rect x="354" y="316" width="18" height="40" rx="9" fill="#2b6cb0"/>
</svg>